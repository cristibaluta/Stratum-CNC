<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="920" height="520" fill="#ffffff"/>

  <text x="40" y="30" font-size="16" font-weight="700" fill="#222">Top view of the machine bed</text>

  <!-- bed -->
  <rect x="40" y="45" width="440" height="410" fill="#f4f6f8" stroke="#8a97a3" stroke-width="2"/>
  <text x="50" y="62" font-size="12" fill="#6b7782">work bed</text>

  <!-- stock -->
  <rect x="200" y="140" width="200" height="160" fill="#e8e1f5" stroke="#7d55c7" stroke-width="2"/>
  <text x="300" y="158" font-size="12" fill="#5a3aa0" text-anchor="middle">stock</text>
  <!-- anchor -->
  <path d="M185,125 H200 V300 H400 V315 H185 Z" fill="#f6c28b" stroke="#d98324" stroke-width="1.5"/>
  <text x="140" y="212" font-size="12" fill="#b3631a" text-anchor="end">anchor</text>

  <!-- bbox -->
  <rect x="235" y="175" width="130" height="90" fill="none" stroke="#1e9e4a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="300" y="224" font-size="12" fill="#1e7a3c" text-anchor="middle">job bounding box</text>
  <text x="300" y="239" font-size="11" fill="#1e7a3c" text-anchor="middle">(toolpath + tool radius)</text>
  <rect x="231" y="261" width="8" height="8" fill="#1e9e4a"/>
  <text x="245" y="283" font-size="11" fill="#1e7a3c">bbox bottom-left</text>

  <!-- MCS origin and axes -->
  <circle cx="60" cy="400" r="5" fill="#c0392b"/>
  <line x1="60" y1="400" x2="115" y2="400" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="60" y1="400" x2="60" y2="345" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="112" y="416" font-size="12" fill="#c0392b">X</text>
  <text x="66" y="342" font-size="12" fill="#c0392b">Y</text>
  <text x="50" y="446" font-size="12" font-weight="700" fill="#c0392b" transform="translate(0,0)">machine origin (MCS 0,0) – fixed</text>

  <!-- offset arrows -->
  <line x1="60" y1="400" x2="200" y2="400" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="400" x2="200" y2="305" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="130" y="392" font-size="12" fill="#222" text-anchor="middle">offset X</text>
  <text x="208" y="360" font-size="12" fill="#222">offset Y</text>

  <!-- WCS origin and axes -->
  <circle cx="200" cy="300" r="6" fill="#1f6fd0"/>
  <line x1="200" y1="300" x2="270" y2="300" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="200" y1="300" x2="200" y2="232" stroke="#1f6fd0" stroke-width="2" marker-end="url(#ab)"/>
  <text x="275" y="304" font-size="12" fill="#1f6fd0">X</text>
  <text x="188" y="228" font-size="12" fill="#1f6fd0">Y</text>
  <text x="212" y="330" font-size="12" font-weight="700" fill="#1f6fd0">work origin (WCS 0,0)</text>
  <text x="212" y="345" font-size="11" fill="#1f6fd0">where the G-code's 0,0 lands</text>

  <text x="40" y="468" font-size="12" fill="#222">machine position = offset + G-code coordinate</text>
  <text x="40" y="486" font-size="12" fill="#555">offset (X,Y) = where the work origin sits in machine coordinates.</text>
  <text x="40" y="504" font-size="12" fill="#555">Your canvas XY offset is this number; the whole job (box included) moves with it.</text>

  <!-- right panel -->
  <text x="520" y="30" font-size="16" font-weight="700" fill="#222">From G-code to real position</text>

  <g font-size="13" fill="#222">
    <rect x="520" y="45" width="370" height="46" rx="8" fill="#eef4ff" stroke="#1f6fd0"/>
    <text x="535" y="66" font-weight="700">G-code coordinate</text>
    <text x="535" y="82" font-size="12" fill="#555">e.g. G1 X10 Y5 – relative to the work origin</text>

    <line x1="705" y1="91" x2="705" y2="106" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="520" y="108" width="370" height="62" rx="8" fill="#eef4ff" stroke="#1f6fd0"/>
    <text x="535" y="129" font-weight="700">+ work offset (G54…G59)</text>
    <text x="535" y="145" font-size="12" fill="#555">G10 L2 P1 X Y = origin at this machine position (absolute)</text>
    <text x="535" y="160" font-size="12" fill="#555">G10 L20 = tool's current position becomes X Y (touch-off)</text>

    <line x1="705" y1="170" x2="705" y2="185" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="520" y="187" width="370" height="46" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="535" y="208" font-weight="700">+ G92 shift (global, easy to forget)</text>
    <text x="535" y="224" font-size="12" fill="#555">clear with G92.1 before a job</text>

    <line x1="705" y1="233" x2="705" y2="248" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="520" y="250" width="370" height="62" rx="8" fill="#f1f8f1" stroke="#1e9e4a"/>
    <text x="535" y="271" font-weight="700">+ tool length offset (Z)</text>
    <text x="535" y="287" font-size="12" fill="#555">each tool sticks out differently; measured on tool setter</text>
    <text x="535" y="302" font-size="12" fill="#555">probe offset: probe's known size is subtracted from the result</text>

    <line x1="705" y1="312" x2="705" y2="327" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="520" y="329" width="370" height="46" rx="8" fill="#f1f8f1" stroke="#1e9e4a"/>
    <text x="535" y="350" font-weight="700">+ bed leveling (Z)</text>
    <text x="535" y="366" font-size="12" fill="#555">probed height grid, corrects Z across the bed</text>

    <line x1="705" y1="375" x2="705" y2="390" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="520" y="392" width="370" height="46" rx="8" fill="#fff4e5" stroke="#d98324"/>
    <text x="535" y="413" font-weight="700">Real machine position (MCS)</text>
    <text x="535" y="429" font-size="12" fill="#555">what the motors actually move to</text>
  </g>
  <text x="520" y="470" font-size="12" fill="#555">Touch-off / probing and your typed offset both end up as the same</text>
  <text x="520" y="486" font-size="12" fill="#555">stored work offset, so if both send an origin, the last one wins.</text>
</svg>